    });
    // radar bottom-right
    const R = 150, cx = 1690, cy = 860; hud.fillStyle = "rgba(13,8,24,0.72)"; hud.beginPath(); hud.arc(cx, cy, R, 0, Math.PI * 2); hud.fill();
    hud.strokeStyle = "rgba(25,227,211,0.5)"; hud.lineWidth = 2; for (const rr of [R, R * 0.66, R * 0.33]) { hud.beginPath(); hud.arc(cx, cy, rr, 0, Math.PI * 2); hud.stroke(); }
    const ang = u * 2.4; const g = hud.createConicGradient(ang, cx, cy); g.addColorStop(0, "rgba(25,227,211,0.45)"); g.addColorStop(0.12, "rgba(25,227,211,0)"); g.addColorStop(1, "rgba(25,227,211,0)");
    hud.fillStyle = g; hud.beginPath(); hud.moveTo(cx, cy); hud.arc(cx, cy, R, ang, ang + Math.PI * 2 * 0.12); hud.fill();
    live.forEach(([tr, x, y, w, h], k) => { const bx = cx + ((x + w / 2) / 1920 - 0.5) * R * 1.6, by = cy + (1 - (y + h) / 1080) * R * 1.4 - R * 0.5; hud.fillStyle = k === 0 ? "#ff3d9a" : "#19e3d3"; hud.beginPath(); hud.arc(bx, by, 7, 0, Math.PI * 2); hud.fill(); });
    hud.fillStyle = "#19e3d3"; hud.font = "800 18px Inter, sans-serif"; hud.fillText("PURSUIT RADAR", cx - 70, cy - R - 14);
  }

  function renderAt(t) {
    if (t < CUT_B) { canvas.style.visibility = "visible"; renderS1(t); }
    else if (t < CUT_C) { canvas.style.visibility = "hidden"; }
    else { canvas.style.visibility = "visible"; if (numMesh) renderS3(t); }
    renderS2(t);
  }
  window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
  renderAt(window.__hfThreeTime || 0);
  </script>
