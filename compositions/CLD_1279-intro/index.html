<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      CLD_1279 intro beat — "raw footage" vs "edited by Claude" sample cards.
      Composition t=0 is rough-cut 34.0 s (renders/CLD_1279-roughcut.mp4).
      Raw card  : t 2.6–12.5  (rough cut 36.6–46.5, "And this is what the raw footage look like…")
      Edit card : t 12.6–24.4 (rough cut 46.6–58.4, "And now compare that with this… This is the final version…")
      Kalyan points to screen-left for raw, screen-right for the edit; both cards stay clear of his face.
    -->
    <style>
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-400-latin.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter-700-latin.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      :root {
        --glass: rgba(14, 14, 22, 0.78);
        --glass-line: rgba(255, 255, 255, 0.2);
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.72);
        --raw: #ff4d4f;
        --claude: #e8775f;
        --amber: #ffb547;
        --blue: #6ea8ff;
        --green: #4cd68a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #talking-head {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        object-fit: cover;
      }

      /* Phone-style sample card: the video itself carries the rounded frame. */
      .sample {
        position: absolute;
        top: 124px;
        width: 468px;
        height: 832px;
        object-fit: cover;
        border-radius: 40px;
        border: 2px solid rgba(255, 255, 255, 0.7);
        box-shadow:
          0 30px 80px rgba(24, 12, 64, 0.45),
          0 0 0 8px rgba(255, 255, 255, 0.12);
        opacity: 0;
      }
      #raw-video {
        left: 150px;
      }
      /* Smaller than the raw card so its tags fit underneath, clear of the sample's own captions. */
      #edit-video {
        left: 1356px;
        top: 96px;
        width: 420px;
        height: 746px;
      }

      .pill {
        position: absolute;
        top: 150px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px 12px 16px;
        border-radius: 999px;
        background: var(--glass);
        border: 1px solid var(--glass-line);
        backdrop-filter: blur(16px);
        color: var(--text);
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0;
      }
      .pill .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
      }
      #raw-pill {
        left: 178px;
      }
      #raw-pill .dot {
        background: var(--raw);
        box-shadow: 0 0 12px var(--raw);
      }
      #edit-pill {
        left: 1380px;
        top: 120px;
      }
      #edit-pill .star {
        color: var(--claude);
        font-size: 26px;
        line-height: 1;
      }

      .tags {
        position: absolute;
        bottom: 150px;
        width: 420px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #raw-tags {
        left: 174px;
      }
      #edit-tags {
        left: 1356px;
        top: 862px;
        bottom: auto;
        width: 420px;
      }
      #edit-tags .tag {
        padding: 11px 16px;
      }
      .tag {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 18px;
        border-radius: 20px;
        background: var(--glass);
        border: 1px solid var(--glass-line);
        backdrop-filter: blur(16px);
        color: var(--text);
        font-size: 24px;
        font-weight: 700;
        opacity: 0;
      }
      .tag .icon {
        flex: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 20px;
        color: #111;
      }
      .tag .sub {
        display: block;
        font-weight: 400;
        font-size: 20px;
        color: var(--muted);
        margin-top: 2px;
      }
      .tag s {
        color: var(--raw);
        text-decoration-thickness: 3px;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="cld1279-intro"
      data-start="0"
      data-duration="26"
      data-fps="25"
      data-width="1920"
      data-height="1080"
    >
      <video
        id="talking-head"
        class="clip"
        src="media/talking-head.mp4"
        playsinline
        data-has-audio="true"
        data-start="0"
        data-duration="26"
        data-track-index="1"
      ></video>

      <!-- Raw sample: source 33.4 s onward (the "fee MCP" flub lands at t≈6.5) -->
      <video
        id="raw-video"
        class="clip sample"
        src="media/sample-raw.mp4"
        muted
        playsinline
        data-start="2.6"
        data-duration="9.9"
        data-media-start="0.4"
        data-track-index="2"
      ></video>
      <div id="raw-pill" class="clip pill" data-start="2.6" data-duration="9.9" data-track-index="3">
        <span class="dot"></span>Raw footage
      </div>
      <div id="raw-tags" class="tags">
        <div id="tag-mistake" class="clip tag" data-start="6.4" data-duration="6.1" data-track-index="4">
          <span class="icon" style="background: var(--raw); color: #fff">✕</span>
          <span>Mistake<span class="sub">“use Higgsfield <s>fee</s> MCP”</span></span>
        </div>
        <div id="tag-dead" class="clip tag" data-start="7.5" data-duration="5.0" data-track-index="5">
          <span class="icon" style="background: var(--amber)">❚❚</span>
          <span>Dead air</span>
        </div>
        <div id="tag-retake" class="clip tag" data-start="8.2" data-duration="4.3" data-track-index="6">
          <span class="icon" style="background: var(--blue)">↻</span>
          <span>Retake</span>
        </div>
      </div>

      <!-- Claude's edit of the same moment: source 29.4 s onward (clean line at t≈15.5) -->
      <video
        id="edit-video"
        class="clip sample"
        src="media/sample-edited.mp4"
        muted
        playsinline
        data-start="12.6"
        data-duration="11.8"
        data-media-start="0.4"
        data-track-index="2"
      ></video>
      <div id="edit-pill" class="clip pill" data-start="12.6" data-duration="11.8" data-track-index="3">
        <span class="star">✳</span>Edited by Claude
      </div>
      <div id="edit-tags" class="tags">
        <div id="tag-clean" class="clip tag" data-start="15.4" data-duration="9.0" data-track-index="4">
          <span class="icon" style="background: var(--green)">✓</span>
          <span>Clean take kept<span class="sub">mistake &amp; retake removed</span></span>
        </div>
        <div id="tag-tight" class="clip tag" data-start="17.0" data-duration="7.4" data-track-index="5">
          <span class="icon" style="background: var(--claude); color: #1a1a1a">✂</span>
          <span>Pauses tightened</span>
        </div>
      </div>

      <script src="vendor/gsap.min.js"></script>
      <script>
        (function () {
          const tl = window.gsap.timeline({ paused: true });
          const enter = (sel, at, from) =>
            tl.fromTo(sel, { opacity: 0, ...from }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, at);
          const exit = (sel, at, to) => tl.to(sel, { opacity: 0, duration: 0.35, ease: "power2.in", ...to }, at);

          // Raw card slides in from the left, where Kalyan points.
          enter("#raw-video", 2.6, { x: -80, scale: 0.96 });
          enter("#raw-pill", 2.85, { y: -12 });
          enter("#tag-mistake", 6.4, { y: 16, scale: 0.95 });
          tl.fromTo("#tag-mistake", { x: 0 }, { x: 8, duration: 0.06, repeat: 5, yoyo: true, ease: "none" }, 6.95);
          enter("#tag-dead", 7.5, { y: 16, scale: 0.95 });
          enter("#tag-retake", 8.2, { y: 16, scale: 0.95 });
          exit("#raw-video, #raw-pill, #tag-mistake, #tag-dead, #tag-retake", 12.15, { x: -60 });

          // Claude's edit slides in from the right.
          enter("#edit-video", 12.6, { x: 80, scale: 0.96 });
          enter("#edit-pill", 12.85, { y: -12 });
          enter("#tag-clean", 15.4, { y: 16, scale: 0.95 });
          enter("#tag-tight", 17.0, { y: 16, scale: 0.95 });
          exit("#edit-video, #edit-pill, #tag-clean, #tag-tight", 24.05, { x: 60 });

          window.__timelines = window.__timelines || {};
          window.__timelines["cld1279-intro"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
