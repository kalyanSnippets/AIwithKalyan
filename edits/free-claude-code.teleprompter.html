<title>Free Claude Code Teleprompter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one tall reading column, a reading-line marker at 38% height, a control bar pinned to the bottom. Deliberately dark (studio prompter). */
:root {
  --bg: #0d0e10; --surface: #17191c; --line: #2a2d33; --fg: #f3f1ec; --muted: #8d9199;
  --accent: #e8775f; --fc: #ffcc4d; --vo: #7cc4ff; --pause: #b48cff;
  --read: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --ui: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --size: 44px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--read); overflow: hidden; }
#scroller { position: absolute; inset: 0; overflow-y: auto; scroll-behavior: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#script { max-width: 1100px; margin: 0 auto; padding-block: 38vh 70vh; font-size: var(--size); line-height: 1.42; }
#script.mirror { transform: scaleX(-1); }
.scene { margin-block: 1.4em 0.4em; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-family: var(--ui); font-size: 0.42em; letter-spacing: .04em; color: var(--muted); }
.scene b { color: var(--fg); font-weight: 700; text-transform: uppercase; }
.chip { border-radius: 999px; padding: 3px 12px; font-weight: 700; font-size: .9em; letter-spacing: .06em; }
.chip.fc { background: var(--fc); color: #1a1500; }
.chip.vo { background: var(--vo); color: #001726; }
.time { font-variant-numeric: tabular-nums; }
p.l { margin: 0 0 .55em; text-wrap: pretty; }
p.l { margin: 0 0 1em; }
.todo { background: color-mix(in srgb, var(--fc) 22%, transparent); outline: 2px dashed var(--fc); border-radius: 6px; padding: 0 .15em; }
.ex { background: color-mix(in srgb, var(--vo) 13%, transparent); border-radius: 6px; padding: 0 .12em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.q { margin-right: .15em; }
span.dir { font-family: var(--ui); font-size: .5em; color: var(--muted); vertical-align: middle; }

p.l strong { color: var(--accent); font-weight: 700; }
p.l.ask { color: #e9dcff; }
p.l.ask::before { content: "💬 "; }
.pause { display: inline-block; margin: 0 .25em; padding: 0 .35em; border: 2px dashed var(--pause); border-radius: 8px; color: var(--pause); font-family: var(--ui); font-size: .55em; vertical-align: middle; letter-spacing: .05em; }
.dir { display: block; margin: -.25em 0 .6em; font-family: var(--ui); font-size: .42em; color: var(--muted); font-style: normal; }
#marker { position: fixed; left: 0; right: 0; top: 38vh; height: 0; border-top: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); pointer-events: none; z-index: 5; }
#marker::before { content: "▶"; position: absolute; left: max(6px, env(safe-area-inset-left, 0px)); top: -0.75em; color: var(--accent); font-size: 22px; }
#bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--surface) 92%, transparent); border-top: 1px solid var(--line); font-family: var(--ui); transition: opacity .3s; }
#bar.dim { opacity: .15; }
#bar:hover, #bar:focus-within { opacity: 1; }
button, select { font: 600 15px var(--ui); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #1b0d08; min-width: 104px; }
.grp { display: flex; align-items: center; gap: 6px; }
.lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.val { min-width: 2.4em; text-align: center; font-variant-numeric: tabular-nums; color: var(--fg); }
#progress { position: fixed; left: 0; top: 0; height: 3px; background: var(--accent); width: 0; z-index: 11; }
.legend { max-width: 1100px; margin: 0 auto 1.2em; font: 500 15px/1.6 var(--ui); color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 18px; }
@media (max-width: 640px) { :root { --size: 30px; } button, select { padding: 8px 10px; font-size: 14px; } }
@media (prefers-reduced-motion: reduce) { #bar { transition: none; } }
</style>

<div id="progress"></div>
<div id="marker" aria-hidden="true"></div>
<div id="scroller" tabindex="-1">
  <div id="script" aria-live="off"></div>
</div>

<div id="bar" role="toolbar" aria-label="Teleprompter controls">
  <button id="play" class="primary" aria-pressed="false">▶ Play</button>
  <div class="grp"><span class="lbl">Speed</span><button id="slower" aria-label="Slower">−</button><span class="val" id="speedVal">3</span><button id="faster" aria-label="Faster">+</button></div>
  <div class="grp"><span class="lbl">Text</span><button id="smaller" aria-label="Smaller text">A−</button><button id="bigger" aria-label="Bigger text">A+</button></div>
  <label class="grp" for="jump"><span class="lbl">Jump</span><select id="jump"></select></label>
  <button id="mirror" aria-pressed="false">Mirror</button>
  <button id="top">⤒ Top</button>
</div>

<script>
// Continuous script v4 (~14–15 min). Each scene: [mode, title, time, [paragraphs]]
// Markup: **key words** · {i}…{/i} = first-time "what is it" explanation · {q} = question to the viewer · {p} = pause · [..] = what to do on screen · {todo}…{/todo} = fill in after recording
const SCRIPT = [
 ["FC","1 · Pain hook","0:00",[
  "Claude Code is one of the most powerful coding tools out there. But it costs **twenty dollars a month**, and the moment you hit your limit in the middle of a task, it just **stops**. You either pay more, or you wait. {p} But here's what most people don't know: **Claude Code itself is free.** What you're paying for is the AI brain inside it. And today, I'm going to swap that brain for **free ones**."
 ]],
 ["FC","2 · The phone example + promise + roadmap","0:34",[
  "Let me explain with a simple example: your phone. The phone is just the hardware, and the SIM card decides who you pay. {i}**Claude Code is like the phone**: a free coding assistant from Anthropic that lives in your terminal and can read, write and run code for you.{/i} {i}**The AI model is like the SIM**: the brain that does the thinking.{/i} Anthropic's model costs twenty dollars a month. But **this phone accepts other SIMs.**",
  "So **by the end of this video**, you'll have the **real Claude Code** running for **zero dollars**, three different ways. **First**, completely on your own laptop, and I'll even switch the Wi-Fi off. **Then**, free AI models in the cloud, plus the one trap that can quietly charge your paid plan. **And finally**, several free providers connected together, where I'll show you **real Claude Sonnet** answering through a free account, with the logs to prove it. And I've put everything into a **free setup kit**: the model list, every prompt and every setting. It's the **first link in the description**. So **stay till the end**, because the last method is the best one."
 ]],
 ["FC","3 · Trust","1:58",[
  "Quick note: **nobody paid for this video**. I've already worked through every setup and every trap, so you don't have to. And I won't just tell you it's free. **I'll show you the receipt every time.** Let's go."
 ]],
 ["VO","4a · Method 1: what Ollama is + install","2:15",[
  "So, method one, and it's called **Ollama**. {i}Ollama is a free app that downloads AI models and runs them right on your own laptop, kind of like a media player, but for AI.{/i} The big difference from ChatGPT or Claude is that **nothing goes to the cloud**. The AI lives on your machine, so it's private, and it even works without internet.",
  "Installing it is super simple. Go to **ollama.com** and click **Download**. It works on Windows, Mac and Linux. I'm on Windows, so I pick Windows and download the installer. Then double-click the file, click through the steps, and that's it. Seriously, that's the whole install. [ollama.com → installer]",
  "Once it's open, you'll see three things on the left. **Apps**: this is where you connect coding tools like Claude Code, Codex and others. Clicking one doesn't install anything, it just copies the command you need. **Chat**: this is where you talk to a model directly, to test it. And **Settings**. [Apps · Chat · Settings]"
 ]],
 ["VO","4b · Two settings that matter","3:26",[
  "In Settings, two things matter. First, the **Cloud** toggle. {i}Ollama can also run some models on its own servers in the cloud.{/i} But we want everything on our laptop, so leave that **off**.",
  "And second, the one most people miss: **context length**. {i}Context length is the AI's short-term memory: how much of your conversation and your project it can hold in its head at once.{/i} Claude Code reads a lot of your files before it changes anything, so if the memory is too small, it loses track halfway through. So drag this slider up to **64K**. That's the fix. [drag the slider to 64K]"
 ]],
 ["VO","4c · First test + Wi-Fi off","4:10",[
  "Now let's test it. Open **Chat**, click the model menu at the bottom, and pick a small model. {i}Models come in sizes like 4B or 9B, which means four or nine **billion** parameters. Bigger usually means smarter, but slower and hungrier for memory.{/i} I pick a small one, **Qwen 3.5 4B**, just to warm things up, and type hi. The **first** message downloads the model, so it takes a minute. After that, it lives on your laptop for good, and you never download it again. [downloading → hi]",
  "But hi proves nothing. So watch this. I'm turning the **Wi-Fi off**. [click the Wi-Fi tile] See? No internet at all. {q} So be honest, do you think it can still write an app? {p} I type: make a simple notes app. And it's thinking… thinking… and it writes the whole thing. **Completely offline.** Every single word came from a model sitting on this laptop.",
  "Then I turn the Wi-Fi back on for one reason: to test the code in a free online compiler. {i}An online compiler is just a website where you paste code and run it instantly.{/i} First try, I picked the wrong language, so I switch it to **HTML**, hit run, and **it works**. Is it pretty? No. But a laptop with no internet just wrote working software, with no subscription, no usage limits, and your code never left your computer."
 ]],
 ["FC","4d · Subscribe hook","5:50",[
  "And honestly, if that alone just saved you twenty dollars a month, **hit subscribe**, because it only gets better from here."
 ]],
 ["VO","4e · Pick the right model for your laptop","5:59",[
  "Now, which model should you actually run? Don't guess. It depends on your **RAM**. {i}RAM is your computer's working memory, and for local AI, it decides how big a model you can run.{/i} On Windows, press **Control, Shift and Escape** to open Task Manager, and click the **Performance** tab. {q} Actually, pause the video and check yours right now. I'll wait. {p} Got it? Okay, here's mine. It's a pretty normal laptop: **no separate graphics card**, just the built-in graphics, and **16 GB of RAM**.",
  "Roughly: with 8 to 16 GB of RAM, stick to **small models**, around 4 to 12 billion parameters. With 32 GB, you can go medium. And with 64 GB or more, you can run the big ones that feel close to the paid thing. The exact list I'd pick for each size is in the **free setup kit**. Just find your RAM. [RAM tier graphic]",
  "Here's a little trick I used too. I asked ChatGPT: here's my laptop, give me the best coding model for Ollama, its exact name, and the **latest** one, because new models come out literally every week. And it suggested **MiMo v2.6**, a 9B model. The exact prompt is in the setup kit."
 ]],
 ["VO","4f · First problem → an AI fixes it","7:28",[
  "And this is where I hit my first problem. MiMo **wasn't in Ollama's dropdown**. Ollama only shows a handful of popular models there. So I tried installing it in the **terminal**, {i}the black text window where you type commands for your computer,{/i} and it told me my Ollama was **too old**. I updated it, tried again, and I was still stuck. And this is exactly where a five-minute setup turns into an hour of Googling.",
  "So instead, I let **another AI** do it for me. It's called **Antigravity**. {i}Antigravity is a free AI coding app from Google. The difference from a normal chatbot is that it can actually work on your computer: it opens the terminal, runs commands, reads the errors and fixes them.{/i} Download it from antigravity.google, sign in with your Google account, open it, and give it one sentence: I'm running AI models locally, install MiMo v2.6 9B and set everything up so it works with Ollama.",
  "It will ask your **permission** before running each command, because it's running things on your machine. **Read each one**, then allow. A few minutes later, it says: installed and tested. Close Ollama, open it again, and the new model is right there in the dropdown. [Antigravity summary → model in dropdown]"
 ]],
 ["FC","4g · The rule of this video","8:59",[
  "And that's going to be the rule for this whole video. **Anything longer than one line, you don't type it yourself. An AI installs it.** And if something breaks on the way, you just copy the error, paste it back, and say **\"fix this\"**."
 ]],
 ["VO","4h · Claude Code on Ollama","9:19",[
  "Now, the part you came here for: putting **Claude Code** on top. In Ollama, go to **Apps** and click **Claude Code**. See that little message? It copied the launch command for you: **ollama launch claude**. [Launch command copied]",
  "Now make a folder anywhere on your computer. Mine is called Claude code. Open it, **right-click** in the empty space, and choose **Open in Terminal**. Paste the command and hit enter. {todo}If Claude Code isn't installed yet, it offers to install it, and you say yes.{/todo} And this is the **real Claude Code**, Anthropic's official app, not a copy. Then it asks which model to use, and I pick my local one. [model picker]",
  "And look at that: **the real Claude Code, running on my own laptop**, with a free local brain inside it. No subscription, no API key. [Claude Code banner with the local model]",
  "Let's give it a real job. I type: build me a simple calculator app. {todo}On my laptop it took about __ minutes,{/todo} because a small local model is doing all the heavy lifting. And that's the honest trade-off: free means **your laptop does the work**, so on a normal machine you pay with your **time**. {todo}But it finished, and it works.{/todo} [test the calculator]",
  "And next time, you don't repeat any of this. Just open your folder in the terminal and run that one line. So method one is your **private, offline** option. For everyday speed, we need something faster, so let's move to the cloud."
 ]],
 ["VO","5a · Method 2: what OpenRouter is + your key","11:04",[
  "Method two is called **OpenRouter**. {i}OpenRouter is one website that gives you access to dozens of AI models from different companies, with a single account and a single key, and a lot of those models are completely free.{/i} The big difference from Ollama: these models run on **their** servers, not on your laptop, so they're much faster, even on a basic laptop.",
  "Go to **openrouter.ai** and sign up. It's free, no credit card needed. Then click **API Keys**, and **Create key**. {i}An API key is basically a password that lets an app, like Claude Code, use your OpenRouter account.{/i} Give it a name, mine is just Claude. [create key]",
  "Now two **seat belts**. First, set an **expiry**. I set seven days, so even if the key leaks, it dies on its own. Second, set a **credit limit**, and I set it to **zero**. That means even if you click the wrong model, it physically **can't charge you**. Then create it, and **copy the key straight away**, because OpenRouter shows it only **once**. And treat it like a password: anyone who has it can use your account."
 ]],
 ["VO","5b · Find the free models","12:26",[
  "Now, which models are free? Click **Models** at the top, and in the price filter on the left, slide it all the way to **free**. Now you'll only see models with **\"(free)\"** in their name, and every request to these costs **zero**. [OpenRouter free filter]",
  "And here's an important tip: this list **changes all the time**. Models come and go, companies end their free offers. So don't memorise the names you see today. **Remember the filter.** As long as you know how to find the free list, you'll always have a free model."
 ]],
 ["VO","5c · Connect it to Claude Code","13:07",[
  "Now let's connect OpenRouter to Claude Code. For that, you paste a small **block of settings** into your terminal, and the whole block is in the setup kit, for both PowerShell and Command Prompt. {i}These settings simply tell Claude Code: don't talk to Anthropic, talk to OpenRouter instead, and here's my key.{/i} [settings block on screen]",
  "Let me show you what each line does. The **first** line sends all of Claude Code's requests to OpenRouter. The **second** line is your key, and that's the **only** thing you change: paste your key between these quotes. The **third** line clears out the old Anthropic key, so there's **no chance** of falling back to a paid key. And the **last few lines** point Claude Code's model slots, Opus, Sonnet and Haiku, at **openrouter/free**. {i}openrouter/free is OpenRouter's free router: it picks a free model for you automatically.{/i}",
  "Then open your folder, right-click, **Open in Terminal**, paste the block, hit enter, and type **claude**. One thing to know: these settings only apply to **that** terminal window. So next time, you paste them again, or you let Antigravity make you a shortcut."
 ]],
 ["VO","5d · The trap","14:28",[
  "And this is where I almost got fooled. The first time I did this, my paste actually **failed**, and I didn't even notice. I typed claude, it opened, and everything looked fine. {q} Look at the top line for a second. Can you spot what's wrong? {p} Yeah. It says Opus and **Claude Pro**. [point at the banner] My paste had failed, so Claude Code had quietly gone back to **my paid Claude subscription**. No error, no warning. Just these red lines in the terminal that I never read.",
  "So here's the check: **if you see your Claude plan on this top line, you're not on the free setup.** I opened a fresh terminal, entered the settings **one line at a time**, typed claude again, and now it says **openrouter/free**, API usage billing. **That's** the free one. [openrouter/free banner]"
 ]],
 ["VO","5e · Check the bill","15:27",[
  "Now let's check it's really free. Type **/model**. You'll still see Opus, Sonnet and Haiku, but those are just the **names of the slots**, not what's actually answering. So I asked it: which model are you? And it said it's a free model running through OpenRouter.",
  "But a model's word isn't proof. So let's **check the bill**. Go to OpenRouter and open the **Activity** page. {i}This is the real log of every request you've sent, which model answered, and what it cost.{/i} {q} Before I scroll down, how much do you think this cost me? {p} Three requests, about twenty-four thousand tokens, and **zero dollars**. [Activity: $0.00]",
  "And one more thing that might scare you. If you type **/usage** in Claude Code, it might say something like thirteen cents. Relax. That's just Claude Code **estimating** the cost at Anthropic's prices. **The real bill is on OpenRouter**, and it says **zero**."
 ]],
 ["VO","5f · The catch","16:32",[
  "But of course, there's a catch. Two, actually. First, **limits**. Free models are capped, about **fifty requests a day** on a new account. And fifty sounds like plenty, until you realise one Claude Code task can use ten or twenty requests, because it reads files, writes them, checks its own work and fixes what it broke. Hit the cap and you'll see error **429**. {i}429 is just the server saying: you've used up your free quota, come back later.{/i}",
  "And second, **privacy**. Unlike Ollama, your prompts and your code now go to someone else's servers. So don't send client code or passwords through free cloud models. Keep those on Ollama."
 ]],
 ["FC","5g · Comment hook","17:22",[
  "So quick question before method three: which one are you leaning towards so far, Ollama or OpenRouter? Or are you waiting for the next one? **Tell me in the comments**, I actually read them. Because method three is where it gets really interesting."
 ]],
 ["VO","6a · Method 3: why OmniRoute","17:41",[
  "So here's the problem with every free option we've seen so far: **every free provider has a limit.** Google gives you some free requests, NVIDIA gives you some, OpenRouter gives you fifty a day. On its own, each one runs out fast. But if you put them **all together**, that's a lot of free AI. And what if, when one runs out, the next one simply takes over, without you doing anything?",
  "That's exactly what **OmniRoute** does. {i}OmniRoute is a free, open-source app. Open source means the code is public on GitHub, so anyone can check what it does. You install it on your own computer, and it sits **in the middle**: Claude Code talks only to OmniRoute, and OmniRoute decides which free AI provider answers each request.{/i} So Claude Code thinks it's talking to one AI, but behind the scenes OmniRoute is juggling many. [GitHub repo, zoom on the description]"
 ]],
 ["VO","6b · Install it with one prompt","18:46",[
  "And we install it with our rule: **an AI does it.** I open Antigravity and give it one prompt. It's in the setup kit, and it basically says: check whether Claude Code is installed, and install it if not. Then install OmniRoute from GitHub, start it, and open the dashboard in my browser. And if any step fails, fix it and keep going.",
  "Now, Antigravity will ask for permission **a lot** here, because it's running real commands on your computer. Don't just click allow on everything. **Read each one**, then allow. [permission prompts] When it's done, it gives me a little summary table: Claude Code found, OmniRoute installed, server running, dashboard opened.",
  "The dashboard opens in your browser at **localhost**. {i}Localhost just means the website is running on your own computer, not on the internet.{/i} The first time, it asks for a password, and the default one is **CHANGEME**. Literally. So log in, and then go straight to Settings and change it to something real."
 ]],
 ["VO","6c · Connect the free providers","19:59",[
  "Now the fun part: connecting free AI providers. {i}A provider is just a company that runs AI models, like Google, NVIDIA or Amazon.{/i} In the dashboard, open **Providers**. You'll see a huge list. Some connect with a **sign-in**, some with an **API key**. For each one, you search for it, click it, and click **Add**. Let me do four of them.",
  "**Number one: Kiro.** {i}Kiro is Amazon's AI coding app, and its free plan includes real Claude models, like Claude Sonnet.{/i} That's why this one is special. Search Kiro, click Add, and OmniRoute first shows a warning. Read it. Then pick how you want to sign in. It gives you a short code and a link. Open the link, sign in, check that the code matches, and approve. It says **\"device authorized\"**, and back in OmniRoute, Kiro shows **connected**. [device authorized → connected]",
  "Now, two honest things about Kiro. The free allowance is **small**, so it won't last long. And during sign-up it even opened a \"subscription required\" page. And OmniRoute itself marks Kiro as **\"terms of service: avoid\"**, because using it this way may go against Kiro's rules. So this one is **your account, your call.**",
  "**Number two: Antigravity**, the same Google app we've been using, but this time as a provider. Click Add, and it opens a Google sign-in. Pick your account and allow. Then your browser lands on a page that **doesn't load**, and that's normal. Copy the full address from the top of that page, paste it back into OmniRoute, and click Connect. That's how OmniRoute gets permission. [paste the callback link] Now you get Gemini models, plus some Claude models within limits. The warning here is even **stronger**: OmniRoute says Google may restrict the account. So please **use a spare Google account**, not your main one.",
  "**Number three: NVIDIA.** {i}NVIDIA, the graphics card company, also gives free access to a bunch of AI models on build.nvidia.com.{/i} Create a free account there. Go to **API Keys**, click **Generate API Key**, give it a name, and copy it. Then back in OmniRoute, open NVIDIA, click Add, and paste the key. And here, switch on **\"Import only free models\"**, so only the free ones come in. [toggle on] Save.",
  "**Number four: Gemini.** {i}Gemini is Google's own AI model, and Google AI Studio gives you a free key for it.{/i} Go to Google AI Studio, click **Get API key**, then **Create API key**, and copy it. In OmniRoute, open Gemini, click Add, paste it, hit **Check** to make sure it works, and Save. [AI Studio key → connected]",
  "And that's four providers connected. Now, one by one, they're small. So let's make them work as **one team**."
 ]],
 ["VO","6d · Build the combo","23:13",[
  "In OmniRoute, that team is called a **combo**. {i}A combo is a list of models in an order: the first one answers, and if it's busy, out of free credits or failing, the next one takes over automatically.{/i} Go to **Combos**, click **Create**, and give it a name. I called mine **Claude**, and you'll see why that name matters in a second.",
  "Now add the steps. For each step, you pick a **provider**, then a **model**, and leave the account on automatic. Click **Add step**. I put Gemini first, then **Kiro's Claude Sonnet**, and then more free backups behind them. You can use the little **up and down arrows** to change the order: top goes first.",
  "Then it asks for a **strategy**, {i}which is simply how OmniRoute chooses between the models in your combo.{/i} You could keep the exact order, or rotate between them. I picked **smart routing**, so it scores each option and picks the best one for every request, and I never have to switch anything by hand. Then **Save**, and the combo is ready. [combo saved]"
 ]],
 ["VO","6e · Create the OmniRoute key","24:32",[
  "Now, Claude Code needs **one key** to use this whole combo, and that's the **OmniRoute API key**. {i}It's OmniRoute's own password. Claude Code shows this key to OmniRoute, and OmniRoute then uses all your provider keys behind the scenes. So Claude Code never needs to see your Google or NVIDIA keys.{/i}",
  "In the dashboard, open **API Keys** and click **Create API Key**. Give it a name, like claude-code, and create it. And now **copy it straight away**, because just like the other keys, you only get to see it **once**. Keep it somewhere safe. [create key]"
 ]],
 ["VO","6f · Two desktop shortcuts + hide paid models","25:14",[

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function fmt(t){
  return esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>")
    .replace(/\{i\}/g,'<span class="ex">').replace(/\{\/i\}/g,'</span>')
    .replace(/\{q\}/g,'<span class="q">💬</span>')
    .replace(/\{todo\}/g,'<span class="todo">').replace(/\{\/todo\}/g,'</span>')
    .replace(/\{p\}/g,'<span class="pause">⏸ pause</span>')
    .replace(/\[(.+?)\]/g,'<span class="dir">[$1]</span>');
}
const root = document.getElementById("script"), jump = document.getElementById("jump");
root.insertAdjacentHTML("beforeend",
 `<div class="legend"><span><span class="chip fc">FACE CAM</span> look at the lens</span><span><span class="chip vo">VOICEOVER</span> talk over the screen</span><span>💬 ask the viewer</span><span><span class="todo" style="font-size:14px">dashed</span> = fill in after recording</span><span><span class="ex" style="font-size:15px;padding:1px 6px">tinted</span> = first-time explanation</span><span><span class="pause" style="font-size:13px">⏸ pause</span> hold 1 second</span><span>[ ] = what to do</span></div>`);
SCRIPT.forEach(([mode,title,time,lines],i)=>{
  const id = "s"+i;
  root.insertAdjacentHTML("beforeend",
   `<div class="scene" id="${id}"><span class="chip ${mode.toLowerCase()}">${mode==="FC"?"FACE CAM":"VOICEOVER"}</span><b>${esc(title)}</b><span class="time">${time}</span></div>`);
  lines.forEach(t=>root.insertAdjacentHTML("beforeend",`<p class="l">${fmt(t)}</p>`));
  jump.insertAdjacentHTML("beforeend",`<option value="${id}">${time} · ${esc(title)}</option>`);
});

const sc = document.getElementById("scroller"), bar = document.getElementById("bar"), prog = document.getElementById("progress");
let store = {}; try { store = JSON.parse(localStorage.getItem("tp") || "{}"); } catch(e) {}
let speed = store.speed || 3, size = store.size || 0, playing = false, last = 0, carry = 0, wake = null;
const save = () => { try { localStorage.setItem("tp", JSON.stringify({speed, size})); } catch(e) {} };
function applySize(){ if (size) document.documentElement.style.setProperty("--size", size+"px"); }
applySize();
document.getElementById("speedVal").textContent = speed;
function frame(t){
  if (!playing) return;
  const dt = last ? (t - last) / 1000 : 0; last = t;
  carry += speed * 14 * dt;            // speed 1–10 ≈ 14–140 px/s
  const px = Math.floor(carry); if (px) { sc.scrollTop += px; carry -= px; }
  requestAnimationFrame(frame);
}
async function setPlay(p){
  playing = p; last = 0;
  const b = document.getElementById("play"); b.textContent = p ? "❚❚ Pause" : "▶ Play"; b.setAttribute("aria-pressed", p);
  bar.classList.toggle("dim", p);
  if (p) { requestAnimationFrame(frame); try { wake = await navigator.wakeLock?.request("screen"); } catch(e) {} }
  else { try { await wake?.release(); } catch(e) {} wake = null; }
}
document.getElementById("play").onclick = () => setPlay(!playing);
document.getElementById("faster").onclick = () => { speed = Math.min(10, speed+1); document.getElementById("speedVal").textContent = speed; save(); };
document.getElementById("slower").onclick = () => { speed = Math.max(1, speed-1); document.getElementById("speedVal").textContent = speed; save(); };
const cur = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--size"));
document.getElementById("bigger").onclick = () => { size = Math.min(96, cur()+4); applySize(); save(); };
document.getElementById("smaller").onclick = () => { size = Math.max(20, cur()-4); applySize(); save(); };
document.getElementById("mirror").onclick = e => { const m = root.classList.toggle("mirror"); e.currentTarget.setAttribute("aria-pressed", m); };
document.getElementById("top").onclick = () => { sc.scrollTop = 0; };
jump.onchange = () => { const el = document.getElementById(jump.value); sc.scrollTop += el.getBoundingClientRect().top - window.innerHeight*0.38 + 10; };
sc.addEventListener("scroll", () => { prog.style.width = (100 * sc.scrollTop / Math.max(1, sc.scrollHeight - sc.clientHeight)) + "%"; });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault(); setPlay(!playing); }
  else if (e.key === "ArrowUp") { e.preventDefault(); speed = Math.min(10, speed+1); document.getElementById("speedVal").textContent = speed; save(); }
  else if (e.key === "ArrowDown") { e.preventDefault(); speed = Math.max(1, speed-1); document.getElementById("speedVal").textContent = speed; save(); }
  else if (e.key === "ArrowLeft") { sc.scrollTop -= 120; }
  else if (e.key === "ArrowRight") { sc.scrollTop += 120; }
});
document.addEventListener("visibilitychange", async () => { if (playing && document.visibilityState === "visible") { try { wake = await navigator.wakeLock?.request("screen"); } catch(e) {} } });
</script>
