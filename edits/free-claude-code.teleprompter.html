<title>Free Claude Code Teleprompter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one tall reading column, a reading-line marker at 38% height, a control bar pinned to the bottom. Deliberately dark (studio prompter). */
:root {
  --bg: #0d0e10; --surface: #17191c; --line: #2a2d33; --fg: #f3f1ec; --muted: #8d9199;
  --accent: #e8775f; --fc: #ffcc4d; --vo: #7cc4ff; --pause: #b48cff;
  --read: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --ui: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --size: 44px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--read); overflow: hidden; }
#scroller { position: absolute; inset: 0; overflow-y: auto; scroll-behavior: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#script { max-width: 1100px; margin: 0 auto; padding-block: 38vh 70vh; font-size: var(--size); line-height: 1.42; }
#script.mirror { transform: scaleX(-1); }
.scene { margin-block: 1.4em 0.4em; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-family: var(--ui); font-size: 0.42em; letter-spacing: .04em; color: var(--muted); }
.scene b { color: var(--fg); font-weight: 700; text-transform: uppercase; }
.chip { border-radius: 999px; padding: 3px 12px; font-weight: 700; font-size: .9em; letter-spacing: .06em; }
.chip.fc { background: var(--fc); color: #1a1500; }
.chip.vo { background: var(--vo); color: #001726; }
.time { font-variant-numeric: tabular-nums; }
p.l { margin: 0 0 .55em; text-wrap: pretty; }
p.l { margin: 0 0 1em; }
.ex { background: color-mix(in srgb, var(--vo) 13%, transparent); border-radius: 6px; padding: 0 .12em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.q { margin-right: .15em; }
span.dir { font-family: var(--ui); font-size: .5em; color: var(--muted); vertical-align: middle; }

p.l strong { color: var(--accent); font-weight: 700; }
p.l.ask { color: #e9dcff; }
p.l.ask::before { content: "💬 "; }
.pause { display: inline-block; margin: 0 .25em; padding: 0 .35em; border: 2px dashed var(--pause); border-radius: 8px; color: var(--pause); font-family: var(--ui); font-size: .55em; vertical-align: middle; letter-spacing: .05em; }
.dir { display: block; margin: -.25em 0 .6em; font-family: var(--ui); font-size: .42em; color: var(--muted); font-style: normal; }
#marker { position: fixed; left: 0; right: 0; top: 38vh; height: 0; border-top: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); pointer-events: none; z-index: 5; }
#marker::before { content: "▶"; position: absolute; left: max(6px, env(safe-area-inset-left, 0px)); top: -0.75em; color: var(--accent); font-size: 22px; }
#bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--surface) 92%, transparent); border-top: 1px solid var(--line); font-family: var(--ui); transition: opacity .3s; }
#bar.dim { opacity: .15; }
#bar:hover, #bar:focus-within { opacity: 1; }
button, select { font: 600 15px var(--ui); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #1b0d08; min-width: 104px; }
.grp { display: flex; align-items: center; gap: 6px; }
.lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.val { min-width: 2.4em; text-align: center; font-variant-numeric: tabular-nums; color: var(--fg); }
#progress { position: fixed; left: 0; top: 0; height: 3px; background: var(--accent); width: 0; z-index: 11; }
.legend { max-width: 1100px; margin: 0 auto 1.2em; font: 500 15px/1.6 var(--ui); color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 18px; }
@media (max-width: 640px) { :root { --size: 30px; } button, select { padding: 8px 10px; font-size: 14px; } }
@media (prefers-reduced-motion: reduce) { #bar { transition: none; } }
</style>

<div id="progress"></div>
<div id="marker" aria-hidden="true"></div>
<div id="scroller" tabindex="-1">
  <div id="script" aria-live="off"></div>
</div>

<div id="bar" role="toolbar" aria-label="Teleprompter controls">
  <button id="play" class="primary" aria-pressed="false">▶ Play</button>
  <div class="grp"><span class="lbl">Speed</span><button id="slower" aria-label="Slower">−</button><span class="val" id="speedVal">3</span><button id="faster" aria-label="Faster">+</button></div>
  <div class="grp"><span class="lbl">Text</span><button id="smaller" aria-label="Smaller text">A−</button><button id="bigger" aria-label="Bigger text">A+</button></div>
  <label class="grp" for="jump"><span class="lbl">Jump</span><select id="jump"></select></label>
  <button id="mirror" aria-pressed="false">Mirror</button>
  <button id="top">⤒ Top</button>
</div>

<script>
// Continuous script. Each scene: [mode, title, time, [paragraphs]]
// Markup: **key words** · {i}…{/i} = first-time "what is it" explanation · {q} = question to the viewer · {p} = pause · [..] = what to do on screen
const SCRIPT = [
 ["FC","1 · Cold open","0:00",[
  "Claude Code costs twenty dollars a month, right? {p} Wrong. **Claude Code itself is free.** What you're actually paying twenty dollars for is the AI brain running inside it. So today I'm going to swap that brain for **free ones**, three completely different ways, and at every step I'll show you the actual bill. Spoiler: it says **zero dollars**."
 ]],
 ["FC","2 · The phone and the SIM","0:20",[
  "Here's the easiest way to think about it. Think about your phone. The phone is just the hardware, and the SIM card decides who you pay every month. {i}**Claude Code is the phone.** It's a free coding assistant from Anthropic, the company behind Claude, that lives in your terminal and can read your files, write code and run commands for you.{/i} {i}**The AI model is the SIM**, the brain that actually thinks and answers.{/i} Anthropic's own SIM costs twenty dollars a month.",
  "But here's the thing: this phone accepts other SIMs. SIM one works with **no network at all**. SIM two is a **free cloud SIM** with a daily limit. And SIM three is a **multi-SIM** that switches to another free SIM by itself when one runs out. {q} So, quick guess: which one of these do you think is free *and* works with no internet at all? {p} Keep that answer in your head, because in about two minutes you're going to see it happen."
 ]],
 ["FC","3 · Stay for SIM three + why trust me","0:55",[
  "And definitely stay for the third one, because at the end I open the logs and show you **real Claude Sonnet** answering through a free account, and I'll also show you exactly where it breaks. Quick note before we start: **nobody paid for this video**, and I pay for my own Claude. I've already worked through every setup, every error and every trap, so you don't have to. And I'm not going to just tell you it's free. **I'll show you the receipt every single time.** So let's go."
 ]],
 ["VO","4a · SIM 1: Ollama","1:20",[
  "Okay, SIM one, and it's called Ollama. {i}**Ollama** is a free app that downloads AI models and runs them right on your own laptop, kind of like a media player, but for AI.{/i} Nothing goes to the cloud. You just go to ollama.com, hit download, run the installer, and that's literally it. Seriously, that's the whole install. [point at the download button]"
 ]],
 ["VO","4b · The switch most people miss","1:50",[
  "Once it's open, you'll see three things. **Apps** is where you connect coding tools like Claude Code with one click. **Chat** is where you can talk to a model to test it. And **Settings** has the one switch most people miss, which is **context length**. {i}Context length is basically the AI's short-term memory: how much of your conversation and your project it can hold in its head at once.{/i} Claude Code reads a lot of your files before it changes anything, so if the memory is too small, it loses track halfway. So I slide it up to **64K**, and that's the fix. [drag the slider]"
 ]],
 ["VO","4c · Wi-Fi off","2:40",[
  "Now let's warm it up with a small model. {i}Models come in sizes like 4B or 9B, which means four or nine **billion** parameters. Bigger usually means smarter, but slower and hungrier for memory.{/i} I pick a small one, Qwen 3.5 4B, and just say hi. The first message downloads the model, so it takes a minute, but after that it lives on your laptop for good.",
  "And now watch this. I'm turning the **Wi-Fi off**. [click the Wi-Fi tile] See? Nothing. No internet at all. {q} So be honest, do you think it can still write an app? {p} Let's find out. I ask it to make a simple notes app, and it's thinking… thinking… and it writes the whole thing. **Completely offline.** Every single word came from a model sitting on this laptop.",
  "Then I turn the Wi-Fi back on just to test the code in a free online compiler. First try, I picked the wrong language, so I switch it to HTML, and **it runs**. Is it pretty? No. But a laptop with no internet just wrote working software, with no subscription, no usage limits, and your code never left your computer."
 ]],
 ["FC","4d · Subscribe hook","3:40",[
  "And honestly, if that alone just saved you twenty dollars a month, **hit subscribe**, because it only gets better from here."
 ]],
 ["VO","4e · Pick the right model","3:50",[
  "Now, which model should you actually run? Don't guess, check your hardware. Press Control, Shift and Escape, and open the Performance tab. {q} Actually, pause the video and do this on your laptop right now. I'll wait. {p} Got it? Okay, here's mine. Mine is a pretty normal laptop: **no separate graphics card**, just the built-in graphics, and **16 GB of RAM**. {i}RAM is your computer's working memory, and for local AI it decides how big a model you can run.{/i}",
  "So I asked ChatGPT for the best coding model for my laptop, with its exact Ollama name, and I asked for the **latest** one, because new models come out literally every week. And it came back with **MiMo v2.6**, a 9B model. The exact prompt I used is in the description."
 ]],
 ["VO","4f · Problem → an AI fixes it","4:45",[
  "And this is where I hit the first problem. The model isn't in Ollama's list. So I tried installing it in the terminal, {i}the black text window where you type commands for your computer,{/i} and it told me my Ollama was too old. I updated it, and I was still stuck. And this is exactly where most people give up and close the laptop.",
  "So instead, I let another AI do it for me. It's called **Antigravity**. {i}Antigravity is a free AI coding app from Google that can actually work on your computer: it opens the terminal, runs commands, reads the errors and fixes them.{/i} I just gave it one sentence: install this model and set it up so it works with Ollama. It asks my permission before each command, I read and allow, and a few minutes later it's installed and tested."
 ]],
 ["FC","4f · The rule of this video","5:30",[
  "And that's going to be the rule for this whole video. **Anything longer than one line, you don't type it yourself. An AI installs it.** And if something breaks, you just copy the error, paste it back, and say **\"fix this\"**."
 ]],
 ["VO","4g · Put SIM 1 in the phone","5:45",[
  "Now let's put this SIM into the phone. In Ollama, go to Apps and click Claude Code, and that copies **one command** for you. Make a folder, open a terminal inside it, paste that command, pick your model, and you're running Claude Code on your own laptop.",
  "But let me be honest with you. On a laptop like mine, local models are slow, and small models can struggle with all the tools Claude Code uses. So think of SIM one as your **private, offline backup**. For everyday speed, we need something stronger. So let's get a cloud SIM."
 ]],
 ["VO","5a · SIM 2: OpenRouter","6:30",[
  "SIM two is called OpenRouter. {i}**OpenRouter** is like a SIM shop for AI: one account and one key give you access to dozens of AI models from different companies, and a lot of them are completely free.{/i} The difference is that these models run on their servers, not on your laptop, so they're much faster.",
  "Sign up, no credit card needed, and create an **API key**. {i}An API key is basically a password that lets an app like Claude Code use your account.{/i} I set it to expire in seven days, and I set the **credit limit to zero**. That's your seat belt: even if you click the wrong thing, it physically can't charge you. Copy the key, because it's shown only once, and treat it like a password.",
  "Then go to Models and set the price filter to **free**. You'll see the free ones marked with \"free\". And here's a tip: this list changes every month, so don't memorise the names. **Remember the filter.**"
 ]],
 ["VO","5b · Insert the SIM","7:20",[
  "To put this SIM into Claude Code, you paste a small block of settings into your terminal. {i}These settings simply tell Claude Code: don't talk to Anthropic, talk to OpenRouter, and here's my key.{/i} The whole block is in the description, and you only change one thing in it: your key goes between these quotes. The last three lines point Claude Code's Opus, Sonnet and Haiku slots at free models instead."
 ]],
 ["VO","5c · The trap","8:00",[
  "And this is where I almost got fooled. My paste actually failed, and I didn't even notice. I typed claude, it opened, and everything looked fine. {q} Look at the top line for a second. Can you spot what's wrong? {p} Yeah. It says Opus and **Claude Pro**. [point at the banner] My phone quietly switched back to my **paid SIM**, my own Claude subscription. So if you ever see your Claude plan on this line, you're **not** on the free SIM.",
  "So I opened a fresh terminal and entered the settings one line at a time, and now it says **openrouter/free**, API usage billing. That's the free SIM."
 ]],
 ["VO","5d · Check the bill","8:50",[
  "Now, the model menu still shows Opus, Sonnet and Haiku, but those are just the names of the slots, not what's actually answering. So I asked it which model it is, and it said it's a free model on OpenRouter. But a model's word isn't proof, so let's check the bill. I open OpenRouter's Activity page. {q} Before I scroll down, how much do you think this cost me? {p} Three requests, and **zero dollars**.",
  "And if Claude Code's own usage screen shows you something like thirteen cents, relax. That's just the phone guessing at Anthropic's prices. **The carrier's bill says zero**, and that's the one that counts."
 ]],
 ["VO","5e · The catch","10:00",[
  "But of course there's a catch. Free SIMs have a daily cap, about **fifty requests a day** on a new account. That sounds like a lot, until you realise one Claude Code task can use ten or twenty requests, because it reads files, writes them and checks its own work. Hit the cap and you'll see error **429**. {i}429 is just the server saying \"you've used up your free quota, come back later\", like your data running out.{/i}"
 ]],
 ["FC","5f · Comment hook","10:30",[
  "So quick question before SIM three: which method are you leaning towards so far, Ollama or OpenRouter? Or are you waiting for the next one? **Tell me in the comments**, I actually read them."
 ]],
 ["VO","6a · SIM 3: the multi-SIM","10:40",[
  "Every free SIM has a limit. Google, NVIDIA, OpenRouter, each one on its own is small. But what if your phone could hold all of them at once, and switch to the next one automatically when one runs out? That's exactly what **OmniRoute** does. {i}**OmniRoute** is a free, open-source app, which means anyone can see and check its code on GitHub. It sits between Claude Code and all your AI providers, and routes each request to one that's free and working.{/i}"
 ]],
 ["VO","6b · Install with one prompt","11:10",[
  "And we install it the same way, with our rule: an AI does it. One prompt to Antigravity: install Claude Code if it isn't there, install OmniRoute, start it, and open the dashboard. {i}The dashboard is just OmniRoute's control panel in your browser.{/i} It asks for permission a lot, so read each one before you allow it. And the first time you log in, the password is **CHANGEME**. So change it."
 ]],
 ["VO","6c · Load the SIMs","12:00",[
  "Alright, now let's load the SIMs. I'll go one by one, and I'll show you what worked and what didn't.",
  "First, **Kiro**. {i}Kiro is Amazon's AI coding app, and its free plan includes real Claude models.{/i} Sign in, approve, and it's connected. Now, the free allowance is small, and during sign-up it even opened a \"subscription required\" page. And OmniRoute itself flags that using Kiro this way may go against Kiro's terms. **So it's your account, and your call.**",
  "Next, **Antigravity**, the same Google app from earlier, but this time as a SIM. Sign in with Google and you get Gemini, plus some Claude models within limits. The warning here is even stronger, so please **use a spare Google account**, not your main one.",
  "Then **NVIDIA**. {i}NVIDIA, the graphics card company, also gives free access to a bunch of AI models through build.nvidia.com.{/i} I made a free key, and it failed: \"unable to get local issuer certificate\". {i}That basically means my laptop's network was checking all the secure traffic, which work laptops often do, so the connection couldn't be trusted.{/i} So it wasn't the key. On a home network it should be fine, and if it isn't, copy, paste, fix this.",
  "And **Gemini**. {i}Gemini is Google's AI model, and Google AI Studio gives you a free key for it.{/i} One more tip: wherever you see **\"Import only free models\"**, switch it on."
 ]],
 ["VO","6d · One combo","14:30",[
  "Now we combine all of these into one **combo**. {i}A combo is just OmniRoute's name for a team of models that work together, with an order of who answers first and who takes over next.{/i} I named mine **Claude**. First Gemini, then Kiro's Claude Sonnet, then more backups behind them. And I set it to smart routing, so it picks the best SIM for each request and I never switch anything by hand. Then I create **one OmniRoute key**, a single master key that unlocks the whole combo."
 ]],
 ["VO","6e · Two buttons on the desktop","15:30",[
  "One more prompt to Antigravity, and I get two shortcuts on my desktop. **\"Free Claude Code\"** checks that OmniRoute is running, starts it if it isn't, and opens Claude Code through it. **\"OmniRoute Dashboard\"** opens the control panel. And then one last fix: hide the paid models, so Claude Code's model menu only shows you free ones and you can't pick a paid one by accident. On my test machine, that's exactly what the menu shows."
 ]],
 ["VO","6f · Moment of truth","16:15",[
  "Okay, moment of truth. **Double-click.** OmniRoute is running, Claude Code opens, and I ask: which model are you? {p} And… error **503**. {i}503 means the service is temporarily unavailable.{/i} Okay. Not what I wanted on camera, but this is real. {q} Most people would quit right here. What would you do? {p} Remember the rule: don't panic. OmniRoute had paused Kiro after a few errors. This is real life with free SIMs. So I ask again.",
  "And now it answers: \"Claude\". But like I said, a model's word isn't proof. **Let's check the bill.** I open the OmniRoute logs, and look at this line: **claude-sonnet-4.5, provider Kiro, combo Claude, status 200**. [zoom the row] {i}Status 200 just means success.{/i} That's **real Claude Sonnet**, answering through a free account."
 ]],
 ["VO","6g · Real test: build an app","17:15",[
  "But talk is cheap, so let's build something real, and watch this part closely. On my test machine, I asked: design me a simple personal note-taking application. And look, it doesn't just start typing code. It's in **plan mode**, {i}a Claude Code mode where it plans and asks you questions before it writes anything,{/i} so it asks me: what tech stack, which features, and how should notes be stored? Then it shows me a plan, and only then does it start building.",
  "And here's the best part. **Real Claude did the planning**, until its free limit ran out, and then the multi-SIM kicked in: **free NVIDIA took over by itself** and kept building. I didn't switch anything. Now, honest truth: the first version didn't work. It took a few fix rounds and a final clean-up. But here it is: notes, tags, Markdown, search, and it even survives a refresh. And the bill? **Zero dollars.**"
 ]],
 ["FC","7 · Which SIM is for you","18:30",[
  "So let's be real for a second. Anyone selling you \"**unlimited free Claude**\" is lying to you. What you actually get is the real Claude Code phone, a small taste of real Claude, and free SIMs for everything else. And for most people, that's honestly plenty.",
  "{q} Now think about your own laptop and how you work. Which SIM fits you? {p} Hold that answer, because you're going to tell me in a minute. If you care about privacy, or you want it to work offline, that's **SIM one, Ollama**. If you don't have strong hardware and you want speed today, that's **SIM two, OpenRouter**. And if you want Claude Code to keep going even when one provider runs out, that's **SIM three, OmniRoute**."
 ]],
 ["FC","7 · The 4 rules","19:10",[
  "And before you try any of this, four quick rules. One: **nothing is unlimited**, every free SIM has a cap. Two: **cloud SIMs can see what you send**, so client code and passwords stay on SIM one. Three: some SIMs, like Kiro and Antigravity, **may go against those services' terms**, so it's your account and your call. And four: **things will break**, and that's normal: copy, paste, fix this. And whatever the menu says, **always check the bill, not the label.**"
 ]],
 ["FC","8 · High-energy close","19:45",[
  "So everyone told you Claude Code costs twenty dollars a month. And today we ran the real Claude Code on three free SIMs: one that works with no internet, one that runs in the cloud, and one that switches by itself when one runs out. **Same phone. Zero bill.** {p}",
  "Every prompt and the settings block are **in the description**, so you can just copy, paste and go. Now remember the SIM you picked a minute ago? **Drop it in the comments** and tell me which one you're trying first, I really do read them. And if this just saved you twenty dollars a month, **subscribe to AI with Kalyan**, because I test these AI tools so you don't have to. See you in the next one."
 ]],
];

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function fmt(t){
  return esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>")
    .replace(/\{i\}/g,'<span class="ex">').replace(/\{\/i\}/g,'</span>')
    .replace(/\{q\}/g,'<span class="q">💬</span>')
    .replace(/\{p\}/g,'<span class="pause">⏸ pause</span>')
    .replace(/\[(.+?)\]/g,'<span class="dir">[$1]</span>');
}
const root = document.getElementById("script"), jump = document.getElementById("jump");
root.insertAdjacentHTML("beforeend",
 `<div class="legend"><span><span class="chip fc">FACE CAM</span> look at the lens</span><span><span class="chip vo">VOICEOVER</span> talk over the screen</span><span>💬 ask the viewer</span><span><span class="ex" style="font-size:15px;padding:1px 6px">tinted</span> = first-time explanation</span><span><span class="pause" style="font-size:13px">⏸ pause</span> hold 1 second</span><span>[ ] = what to do</span></div>`);
SCRIPT.forEach(([mode,title,time,lines],i)=>{
  const id = "s"+i;
  root.insertAdjacentHTML("beforeend",
   `<div class="scene" id="${id}"><span class="chip ${mode.toLowerCase()}">${mode==="FC"?"FACE CAM":"VOICEOVER"}</span><b>${esc(title)}</b><span class="time">${time}</span></div>`);
  lines.forEach(t=>root.insertAdjacentHTML("beforeend",`<p class="l">${fmt(t)}</p>`));
  jump.insertAdjacentHTML("beforeend",`<option value="${id}">${time} · ${esc(title)}</option>`);
});

const sc = document.getElementById("scroller"), bar = document.getElementById("bar"), prog = document.getElementById("progress");
let store = {}; try { store = JSON.parse(localStorage.getItem("tp") || "{}"); } catch(e) {}
let speed = store.speed || 3, size = store.size || 0, playing = false, last = 0, carry = 0, wake = null;
const save = () => { try { localStorage.setItem("tp", JSON.stringify({speed, size})); } catch(e) {} };
function applySize(){ if (size) document.documentElement.style.setProperty("--size", size+"px"); }
applySize();
document.getElementById("speedVal").textContent = speed;
function frame(t){
  if (!playing) return;
  const dt = last ? (t - last) / 1000 : 0; last = t;
  carry += speed * 14 * dt;            // speed 1–10 ≈ 14–140 px/s
  const px = Math.floor(carry); if (px) { sc.scrollTop += px; carry -= px; }
  requestAnimationFrame(frame);
}
async function setPlay(p){
  playing = p; last = 0;
  const b = document.getElementById("play"); b.textContent = p ? "❚❚ Pause" : "▶ Play"; b.setAttribute("aria-pressed", p);
  bar.classList.toggle("dim", p);
  if (p) { requestAnimationFrame(frame); try { wake = await navigator.wakeLock?.request("screen"); } catch(e) {} }
  else { try { await wake?.release(); } catch(e) {} wake = null; }
}
document.getElementById("play").onclick = () => setPlay(!playing);
document.getElementById("faster").onclick = () => { speed = Math.min(10, speed+1); document.getElementById("speedVal").textContent = speed; save(); };
document.getElementById("slower").onclick = () => { speed = Math.max(1, speed-1); document.getElementById("speedVal").textContent = speed; save(); };
const cur = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--size"));
document.getElementById("bigger").onclick = () => { size = Math.min(96, cur()+4); applySize(); save(); };
document.getElementById("smaller").onclick = () => { size = Math.max(20, cur()-4); applySize(); save(); };
document.getElementById("mirror").onclick = e => { const m = root.classList.toggle("mirror"); e.currentTarget.setAttribute("aria-pressed", m); };
document.getElementById("top").onclick = () => { sc.scrollTop = 0; };
jump.onchange = () => { const el = document.getElementById(jump.value); sc.scrollTop += el.getBoundingClientRect().top - window.innerHeight*0.38 + 10; };
sc.addEventListener("scroll", () => { prog.style.width = (100 * sc.scrollTop / Math.max(1, sc.scrollHeight - sc.clientHeight)) + "%"; });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault(); setPlay(!playing); }
  else if (e.key === "ArrowUp") { e.preventDefault(); speed = Math.min(10, speed+1); document.getElementById("speedVal").textContent = speed; save(); }
  else if (e.key === "ArrowDown") { e.preventDefault(); speed = Math.max(1, speed-1); document.getElementById("speedVal").textContent = speed; save(); }
  else if (e.key === "ArrowLeft") { sc.scrollTop -= 120; }
  else if (e.key === "ArrowRight") { sc.scrollTop += 120; }
});
document.addEventListener("visibilitychange", async () => { if (playing && document.visibilityState === "visible") { try { wake = await navigator.wakeLock?.request("screen"); } catch(e) {} } });
</script>
